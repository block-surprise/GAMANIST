<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMANIST</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-color: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #fbbf24;
            --danger-color: #ef4444;
            --nav-bg: #1e293b;
        }

        body {
            margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            line-height: 1.6;
        }

        .hidden { display: none !important; }

      
        nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--nav-bg); display: flex; justify-content: space-around;
            padding: 10px 0; border-top: 1px solid #334155; z-index: 2000;
        }

        @media (min-width: 768px) {
            nav { top: 0; bottom: auto; border-top: none; border-bottom: 1px solid #334155; height: 60px; }
            body { padding-top: 60px; }
        }

        nav a { color: #94a3b8; text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; cursor: pointer; flex: 1; }
        nav a i { font-size: 20px; margin-bottom: 4px; }
        nav a.active { color: var(--accent-color); }

     
        header {
            padding: 20px; text-align: center;
            border-bottom: 2px solid var(--accent-color);
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
        }

        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; }

        main { padding: 20px; padding-bottom: 100px; max-width: 500px; margin: 0 auto; }

      
        .card {
            background: var(--card-color); padding: 20px;
            border-radius: 16px; margin-bottom: 15px;
            border-left: 5px solid var(--accent-color);
            display: flex; justify-content: space-between; align-items: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .gaman-info h3 { margin: 0; font-size: 1.1rem; }
        .timer { font-family: monospace; color: var(--accent-color); font-size: 0.9rem; }
        .rank { font-size: 0.7rem; color: #94a3b8; background: #334155; padding: 2px 8px; border-radius: 10px; margin-top: 5px; display: inline-block; }

        .fail-btn {
            background: transparent; border: 1px solid var(--danger-color);
            color: var(--danger-color); padding: 8px 12px; border-radius: 8px; cursor: pointer;
        }

       
        input {
            width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #334155;
            background: #0f172a; color: white; margin-bottom: 20px; box-sizing: border-box;
        }

        .save-btn {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: var(--accent-color); color: #0f172a; font-weight: bold; cursor: pointer;
        }

        .history-item {
            border-bottom: 1px solid #334155; padding: 10px 0; color: #94a3b8;
            display: flex; justify-content: space-between; font-size: 0.9rem;
        }

        .empty-state { text-align: center; color: #64748b; margin-top: 50px; }
    </style>
</head>
<body>

<nav>
    <a id="nav-home" class="active" onclick="showScreen('home')"><i class="fas fa-fire"></i>修行中</a>
    <a id="nav-add" onclick="showScreen('add')"><i class="fas fa-plus-circle"></i>誓う</a>
    <a id="nav-stats" onclick="showScreen('stats')"><i class="fas fa-chart-bar"></i>戦績</a>
</nav>

<header>
    <h1>GAMANIST</h1>
</header>

<main>
    <section id="home-screen">
        <h2 style="font-size: 1.1rem;">現在の修行</h2>
        <div id="gaman-list"></div>
    </section>

    <section id="add-screen" class="hidden">
        <h2 style="font-size: 1.1rem;">新たな誓い</h2>
        <input type="text" id="gaman-input" placeholder="例：SNSを見ない、間食禁止..." maxlength="20">
        <button class="save-btn" onclick="addGaman()">修行開始</button>
    </section>

    <section id="stats-screen" class="hidden">
        <h2 style="font-size: 1.1rem;">過去の敗北記録</h2>
        <div id="history-list"></div>
    </section>
</main>

<script>
    let gamans = JSON.parse(localStorage.getItem('gamans')) || [];
    let history = JSON.parse(localStorage.getItem('history')) || [];

    function showScreen(screen) {
        document.getElementById('home-screen').classList.toggle('hidden', screen !== 'home');
        document.getElementById('add-screen').classList.toggle('hidden', screen !== 'add');
        document.getElementById('stats-screen').classList.toggle('hidden', screen !== 'stats');
        
        document.getElementById('nav-home').classList.toggle('active', screen === 'home');
        document.getElementById('nav-add').classList.toggle('active', screen === 'add');
        document.getElementById('nav-stats').classList.toggle('active', screen === 'stats');

        if(screen === 'home') renderList();
        if(screen === 'stats') renderHistory();
    }

    function addGaman() {
        const input = document.getElementById('gaman-input');
        if (!input.value) return;
        gamans.push({ id: Date.now(), title: input.value, startTime: Date.now() });
        localStorage.setItem('gamans', JSON.stringify(gamans));
        input.value = "";
        showScreen('home');
    }

    function deleteGaman(id) {
        if(confirm('誘惑に負けましたか？修行を記録に残します。')) {
            const target = gamans.find(g => g.id === id);
            const duration = Date.now() - target.startTime;
            
            // 履歴に追加
            history.unshift({ title: target.title, time: formatDuration(duration) });
            localStorage.setItem('history', JSON.stringify(history));

            gamans = gamans.filter(g => g.id !== id);
            localStorage.setItem('gamans', JSON.stringify(gamans));
            renderList();
        }
    }

    function getRank(diff) {
        const sec = diff / 1000;
        if (sec < 60) return "修行生";
        if (sec < 3600) return "自制の徒";
        if (sec < 86400) return "鋼のガマニスト";
        if (sec < 259200) return "自制の鉄人";
        return "伝説のガマニスト";
    }

    function formatDuration(diff) {
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        return `${h}h ${m}m ${s}s`;
    }

    function renderList() {
        const container = document.getElementById('gaman-list');
        if (gamans.length === 0) {
            container.innerHTML = '<div class="empty-state">修行中の項目はありません</div>';
            return;
        }
        container.innerHTML = gamans.map(g => `
            <div class="card">
                <div class="gaman-info">
                    <h3>${g.title}</h3>
                    <div class="timer" id="timer-${g.id}"></div>
                    <div class="rank" id="rank-${g.id}">称号：計算中</div>
                </div>
                <button class="fail-btn" onclick="deleteGaman(${g.id})">負けた</button>
            </div>
        `).join('');
    }

    function renderHistory() {
        const container = document.getElementById('history-list');
        if (history.length === 0) {
            container.innerHTML = '<div class="empty-state">まだ敗北の記録はありません</div>';
            return;
        }
        container.innerHTML = history.map(h => `
            <div class="history-item">
                <span>${h.title}</span>
                <span>${h.time}</span>
            </div>
        `).join('');
    }

    setInterval(() => {
        const now = Date.now();
        gamans.forEach(g => {
            const timerEl = document.getElementById(`timer-${g.id}`);
            const rankEl = document.getElementById(`rank-${g.id}`);
            if (timerEl && rankEl) {
                const diff = now - g.startTime;
                timerEl.innerText = formatDuration(diff);
                rankEl.innerText = `称号：${getRank(diff)}`;
            }
        });
    }, 1000);

    renderList();
</script>
</body>
</html>
