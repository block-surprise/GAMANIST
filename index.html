<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMANIST - 鋼の自制心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon2.png">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-color: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #fbbf24; /* ゴールド */
            --danger-color: #ef4444;
            --nav-bg: #1e293b;
        }

        body {
            margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            line-height: 1.6;
        }

        .hidden { display: none !important; }

        /* ナビゲーション（PCは上、スマホは下） */
        nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--nav-bg); display: flex; justify-content: space-around;
            padding: 10px 0; border-top: 1px solid #334155; z-index: 2000;
        }

        @media (min-width: 768px) {
            nav { top: 0; bottom: auto; border-top: none; border-bottom: 1px solid #334155; height: 60px; }
            body { padding-top: 60px; } /* PC時の重なりを完全に回避 */
        }

        nav a { color: #94a3b8; text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; cursor: pointer; flex: 1; }
        nav a i { font-size: 20px; margin-bottom: 4px; }
        nav a.active { color: var(--accent-color); }

        /* ヘッダー */
        header {
            padding: 20px; text-align: center;
            border-bottom: 2px solid var(--accent-color);
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
        }

        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; }

        main { padding: 20px; padding-bottom: 100px; max-width: 500px; margin: 0 auto; }

        /* カード（修行リスト） */
        .card {
            background: var(--card-color); padding: 20px;
            border-radius: 16px; margin-bottom: 15px;
            border-left: 5px solid var(--accent-color);
            display: flex; justify-content: space-between; align-items: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .gaman-info h3 { margin: 0; font-size: 1.1rem; }
        .timer { font-family: monospace; color: var(--accent-color); font-size: 0.9rem; }
        .rank { font-size: 0.7rem; color: #94a3b8; background: #334155; padding: 2px 8px; border-radius: 10px; margin-top: 5px; display: inline-block; }

        .fail-btn {
            background: transparent; border: 1px solid var(--danger-color);
            color: var(--danger-color); padding: 8px 12px; border-radius: 8px;
            cursor: pointer; transition: 0.3s;
        }

        .fail-btn:hover { background: var(--danger-color); color: white; }

        /* フォーム */
        .form-container { margin-top: 20px; }
        input {
            width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #334155;
            background: #0f172a; color: white; margin-bottom: 20px; font-size: 1rem;
            box-sizing: border-box;
        }

        .save-btn {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: var(--accent-color); color: #0f172a;
            font-weight: bold; font-size: 1rem; cursor: pointer;
        }

        /* 戦績・情報エリア用 */
        .empty-state { text-align: center; color: #64748b; margin-top: 50px; }
        .history-item {
            border-bottom: 1px solid #334155; padding: 10px 0; color: #94a3b8;
            display: flex; justify-content: space-between; font-size: 0.9rem;
        }
        .policy-box {
            height: 120px; overflow-y: scroll; border: 1px solid #334155;
            padding: 10px; border-radius: 8px; margin-top: 10px; background: #0f172a; font-size: 0.75rem;
        }
    </style>
</head>
<body>

<nav>
    <a id="nav-home" class="active" onclick="showScreen('home')"><i class="fas fa-fire"></i>修行中</a>
    <a id="nav-add" onclick="showScreen('add')"><i class="fas fa-plus-circle"></i>誓う</a>
    <a id="nav-stats" onclick="showScreen('stats')"><i class="fas fa-chart-bar"></i>戦績</a>
    <a id="nav-info" onclick="showScreen('info')"><i class="fas fa-info-circle"></i>情報</a>
</nav>

<header>
    <h1>GAMANIST</h1>
</header>

<main>
    <section id="home-screen">
        <h2 style="font-size: 1.1rem;">現在の修行</h2>
        <div id="gaman-list"></div>
    </section>

    <section id="add-screen" class="hidden">
        <h2 style="font-size: 1.1rem;">新たな誓い</h2>
        <div class="form-container">
            <input type="text" id="gaman-input" placeholder="例：SNS、間食、夜更かし..." maxlength="20">
            <button class="save-btn" onclick="addGaman()">修行開始</button>
        </div>
    </section>

    <section id="stats-screen" class="hidden">
        <h2 style="font-size: 1.1rem;">過去の敗北記録</h2>
        <div id="history-list"></div>
    </section>

    <section id="info-screen" class="hidden">
        <h2 style="font-size: 1.1rem;">情報とポリシー</h2>
        <div class="card" style="display:block">
            <h3>GAMANIST v1.0.0</h3>
            <p style="font-size: 0.85rem; color: #94a3b8;">あなたの自制心を「称号」で可視化する修行支援アプリです。</p>
        </div>
        <div class="card" style="display:block">
            <h3>プライバシーポリシー</h3>
            <div class="policy-box">
                本アプリは、入力された修行データを端末内（LocalStorage）にのみ保存し、外部サーバーへ送信することはありません。Google AdSenseおよびAnalyticsを利用する場合、クッキーを使用して利用統計を収集することがありますが、個人を特定する情報は含みません。
            </div>
        </div>
        <div class="card" style="display:block">
            <h3>お問い合わせ</h3>
            <p style="font-size: 0.85rem; color: #94a3b8;">kakeradesign12@gmail.com</p>
        </div>
    </section>
</main>

<script>
    let gamans = JSON.parse(localStorage.getItem('gamans')) || [];
    let history = JSON.parse(localStorage.getItem('history')) || [];

    function showScreen(screen) {
        const screens = ['home', 'add', 'stats', 'info'];
        screens.forEach(s => {
            document.getElementById(`${s}-screen`).classList.toggle('hidden', s !== screen);
            document.getElementById(`nav-${s}`).classList.toggle('active', s === screen);
        });

        if (screen === 'home') renderList();
        if (screen === 'stats') renderHistory();
    }

    function addGaman() {
        const input = document.getElementById('gaman-input');
        if (!input.value) return;
        const newGaman = { id: Date.now(), title: input.value, startTime: Date.now() };
        gamans.push(newGaman);
        localStorage.setItem('gamans', JSON.stringify(gamans));
        input.value = "";
        showScreen('home');
    }

    function deleteGaman(id) {
        if(confirm('誘惑に負けましたか？修行をやり直しましょう。')) {
            const target = gamans.find(g => g.id === id);
            const duration = Date.now() - target.startTime;
            history.unshift({ title: target.title, time: formatDuration(duration) });
            localStorage.setItem('history', JSON.stringify(history));

            gamans = gamans.filter(g => g.id !== id);
            localStorage.setItem('gamans', JSON.stringify(gamans));
            renderList();
        }
    }

    function getRank(diff) {
        const sec = diff / 1000;
        if (sec < 60) return "修行生";
        if (sec < 3600) return "自制の徒";
        if (sec < 86400) return "鋼のガマニスト";
        return "自制の鉄人";
    }

    function formatDuration(diff) {
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        return `${h}h ${m}m ${s}s`;
    }

    function renderList() {
        const container = document.getElementById('gaman-list');
        if (gamans.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fas fa-leaf" style="font-size: 3rem; margin-bottom: 10px;"></i><br>修行中の項目はありません</div>';
            return;
        }
        container.innerHTML = gamans.map(g => `
            <div class="card">
                <div class="gaman-info">
                    <h3>${g.title}</h3>
                    <div class="timer" id="timer-${g.id}">計算中...</div>
                    <div class="rank" id="rank-${g.id}">称号：取得中</div>
                </div>
                <button class="fail-btn" onclick="deleteGaman(${g.id})">負けた</button>
            </div>
        `).join('');
    }

    function renderHistory() {
        const container = document.getElementById('history-list');
        if (history.length === 0) {
            container.innerHTML = '<div class="empty-state">まだ敗北の記録はありません</div>';
            return;
        }
        container.innerHTML = history.map(h => `
            <div class="history-item">
                <span>${h.title}</span>
                <span>${h.time}</span>
            </div>
        `).join('');
    }

    setInterval(() => {
        const now = Date.now();
        gamans.forEach(g => {
            const timerEl = document.getElementById(`timer-${g.id}`);
            const rankEl = document.getElementById(`rank-${g.id}`);
            if (timerEl && rankEl) {
                const diff = now - g.startTime;
                timerEl.innerText = `継続：${formatDuration(diff)}`;
                rankEl.innerText = `称号：${getRank(diff)}`;
            }
        });
    }, 1000);

    renderList();
</script>

</body>
</html>
